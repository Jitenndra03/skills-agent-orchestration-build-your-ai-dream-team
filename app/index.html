<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A contributor-friendly overview of project status, activity, and priority."
    />
    <title>Project Pulse</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#projects">Skip to projects</a>

    <main class="dashboard">
      <header class="dashboard-header">
        <div>
          <p class="dashboard-kicker">Team overview</p>
          <h1>Project Pulse</h1>
          <p class="dashboard-intro">
            A quick read on what the team is building, what changed recently, and
            where attention is needed.
          </p>
        </div>
      </header>

      <section aria-labelledby="projects-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Delivery snapshot</p>
            <h2 id="projects-heading">Current projects</h2>
          </div>
          <p id="project-count" aria-live="polite"></p>
        </div>

        <div id="projects" class="project-list" aria-live="polite">
          <p class="loading" role="status">Loading project updates...</p>
        </div>
      </section>
    </main>

    <script>
      const projectsContainer = document.querySelector("#projects");
      const projectCount = document.querySelector("#project-count");

      function createMetaRow(label, value, className) {
        const row = document.createElement("div");
        row.className = "project-meta-row";

        const term = document.createElement("dt");
        term.textContent = label;

        const description = document.createElement("dd");
        description.className = className || "meta-value";
        description.textContent = value;

        row.append(term, description);
        return row;
      }

      function createProjectCard(project) {
        const card = document.createElement("article");
        card.className = "project-card";

        const header = document.createElement("header");
        header.className = "project-card-header";

        const name = document.createElement("h3");
        name.textContent = project.name;

        const status = document.createElement("span");
        status.className = "status-badge";
        status.dataset.status = project.status.toLowerCase().replace(/\s+/g, "-");
        status.textContent = project.status;
        status.setAttribute("aria-label", `Status: ${project.status}`);

        header.append(name, status);

        const body = document.createElement("div");
        body.className = "project-card-body";

        const metadata = document.createElement("dl");
        metadata.className = "project-meta";
        const priorityRow = createMetaRow("Priority", project.priority, "priority-badge");
        priorityRow.querySelector("dd").dataset.priority = project.priority.toLowerCase();
        metadata.append(
          createMetaRow("Owner", project.owner, "project-owner meta-value"),
          createMetaRow("Recent activity", project.recentActivity, "recent-activity meta-value"),
          priorityRow,
        );

        body.append(metadata);
        card.append(header, body);
        return card;
      }

      function showEmptyState() {
        projectsContainer.replaceChildren();
        const emptyState = document.createElement("p");
        emptyState.className = "empty-state";
        emptyState.setAttribute("role", "status");
        emptyState.textContent = "No projects are available right now.";
        projectsContainer.append(emptyState);
        projectCount.textContent = "0 projects";
      }

      function showErrorState() {
        projectsContainer.replaceChildren();
        const errorState = document.createElement("p");
        errorState.className = "error-state";
        errorState.setAttribute("role", "alert");
        errorState.textContent =
          "Project updates could not be loaded. Please try again later.";
        projectsContainer.append(errorState);
        projectCount.textContent = "";
      }

      async function loadProjects() {
        try {
          const response = await fetch("project-data.json");
          if (!response.ok) {
            throw new Error(`Project data request failed with status ${response.status}.`);
          }

          const data = await response.json();
          if (!data || !Array.isArray(data.projects)) {
            throw new Error("Project data does not contain a projects array.");
          }

          if (data.projects.length === 0) {
            showEmptyState();
            return;
          }

          const validProjects = data.projects.filter(
            (project) =>
              project &&
              ["name", "owner", "status", "recentActivity", "priority"].every(
                (field) => typeof project[field] === "string" && project[field].trim(),
              ),
          );

          if (validProjects.length !== data.projects.length) {
            throw new Error("Project data contains an incomplete project record.");
          }

          projectsContainer.replaceChildren(
            ...validProjects.map((project) => createProjectCard(project)),
          );
          projectCount.textContent = `${validProjects.length} ${
            validProjects.length === 1 ? "project" : "projects"
          }`;
        } catch (error) {
          showErrorState();
          console.error("Unable to load Project Pulse data.", error);
        }
      }

      loadProjects();
    </script>
  </body>
</html>
